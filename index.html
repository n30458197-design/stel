<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f5fb;--surface:#fff;--ink:#181d3a;--muted:#5b6586;--line:#dde1f0;--accent:#3347ff;--on-accent:#fff;--chip:#e6e9f7}
@media (prefers-color-scheme:dark){:root{--bg:#0e1226;--surface:#171c3a;--ink:#eef0ff;--muted:#9aa4cc;--line:#2a3260;--accent:#8793ff;--on-accent:#0e1226;--chip:#232a52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hid{display:none!important}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{background:none;border:0;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;padding:4px;white-space:nowrap}
.search{flex:1;max-width:560px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-width:0}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:9px 16px;font-weight:600;white-space:nowrap}
.btn.alt{background:var(--chip);color:var(--ink)}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 16px}
.card{background:none;border:0;text-align:left;padding:0;display:block;width:100%}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#2b3a8f,#6a3fa0)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;padding:1px 6px;border-radius:4px}
.meta{display:flex;gap:10px;margin-top:10px}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800}
.t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:60px 16px}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
@media(max-width:960px){.watch{grid-template-columns:1fr}}
.player{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.player video{width:100%;height:100%;display:block}
.player{position:relative}
.player video{cursor:pointer}
.pbar{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;transition:opacity .2s}
.player.idle:not(.paused) .pbar{opacity:0}
.player.idle:not(.paused){cursor:none}
.seek{width:100%;accent-color:var(--accent);margin:0 0 4px;cursor:pointer}
.prow{display:flex;align-items:center;gap:6px}
.pbtn{background:none;border:0;color:#fff;font-size:1.05rem;padding:6px 8px;border-radius:8px;min-width:36px}
.pbtn:hover{background:rgba(255,255,255,.18)}
.vol{width:80px;accent-color:var(--accent)}
.ptime{font-size:.85rem;margin-left:6px;font-variant-numeric:tabular-nums}
.sp{flex:1}
.perr{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.7)}
.player:fullscreen{border-radius:0;aspect-ratio:auto}
@media(max-width:560px){.vol{display:none}}
h1{font-size:1.25rem;margin:12px 0 8px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.ch{display:flex;align-items:center;gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.cm h2{font-size:1.05rem}
.cm .in{display:flex;gap:10px;margin:12px 0 18px}
.cm textarea{flex:1;min-height:44px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.c{display:flex;gap:10px;margin-bottom:14px}
.side .card{display:flex;gap:10px;margin-bottom:12px}
.side .thumb{width:168px;flex:none}
.side .meta{margin:0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;margin:12px 0 4px;font-weight:600}
dialog input[type=text],dialog input[type=email],dialog input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
dialog .row{margin-top:18px;justify-content:flex-end}
.err{color:#c62a47;font-size:.85rem;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>
<div class="top">
  <button class="logo" id="home" aria-label="Ir al inicio">▶ Mis videos</button>
  <input class="search" id="q" type="search" placeholder="Buscar" aria-label="Buscar videos">
  <button class="btn" id="up">Subir video</button>
  <button class="btn alt" id="out">Salir</button>
  <button class="btn" id="in">Iniciar sesión</button>
</div>
<div class="wrap" id="app"></div>

<dialog id="adlg">
  <h2 style="margin:0">Tu cuenta</h2>
  <label for="em">Correo</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Contraseña (mínimo 6 caracteres)</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="aerr" role="alert"></div>
  <div class="row"><button class="btn alt" id="acancel">Cancelar</button><button class="btn alt" id="signup">Crear cuenta</button><button class="btn" id="signin">Entrar</button></div>
</dialog>

<dialog id="udlg">
  <h2 style="margin:0">Subir video</h2>
  <label for="f">Archivo</label><input id="f" type="file" accept="video/*">
  <label for="ti">Título</label><input id="ti" type="text" maxlength="100">
  <label for="cn">Nombre del canal</label><input id="cn" type="text" maxlength="40" value="Mi canal">
  <div class="err" id="uerr" role="alert"></div>
  <div class="row"><button class="btn alt" id="ucancel">Cancelar</button><button class="btn" id="pub">Publicar</button></div>
</dialog>

<script>
(function(){
  // 1) Pega aquí tu clave pública (anon o publishable) de Supabase
  const SUPABASE_URL='https://hrhexdkjirhvuvcjewzn.supabase.co';
  const SUPABASE_KEY='sb_publishable_iHud6QkhZt1RsVZRhgwOxA_mbTilFkk';

  const $=id=>document.getElementById(id), app=$('app');
  function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  if(SUPABASE_KEY.indexOf('PEGA')===0){app.appendChild(el('div','empty','Falta la clave de Supabase. Ábrela en index.html y pégala en SUPABASE_KEY.'));return}
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  let user=null,vids=[];

  const pub=p=>sb.storage.from('videos').getPublicUrl(p).data.publicUrl;
  const fmt=s=>{s=s||0;const m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+(r<10?'0':'')+r};
  function ago(d){const m=Math.floor((Date.now()-new Date(d))/60000);if(m<1)return 'hace un momento';if(m<60)return 'hace '+m+(m===1?' minuto':' minutos');const h=Math.floor(m/60);if(h<24)return 'hace '+h+(h===1?' hora':' horas');const dd=Math.floor(h/24);return 'hace '+dd+(dd===1?' día':' días')}
  const views=n=>n+(n===1?' vista':' vistas');
  const avatar=n=>el('div','av',(n||'?').charAt(0).toUpperCase());
  const who=()=>user?(user.email||'Usuario').split('@')[0]:'';

  function renderTop(){
    $('up').classList.toggle('hid',!user);
    $('out').classList.toggle('hid',!user);
    $('in').classList.toggle('hid',!!user);
  }
  function needLogin(){$('aerr').textContent='';$('adlg').showModal()}

  async function loadVideos(){
    const r=await sb.from('videos').select('*').order('created_at',{ascending:false});
    vids=r.data||[];
    if(r.error)app.appendChild(el('div','empty','No se pudieron cargar los videos: '+r.error.message));
  }

  function card(x,side){
    const b=el('button','card');b.onclick=()=>watch(x.id);
    const th=el('div','thumb');
    if(x.thumb_path){const im=el('img');im.src=pub(x.thumb_path);im.alt='';im.loading='lazy';th.appendChild(im)}
    th.appendChild(el('span','dur',fmt(x.duration)));
    const m=el('div','meta');if(!side)m.appendChild(avatar(x.channel));
    const tx=el('div');tx.appendChild(el('div','t',x.title));tx.appendChild(el('div','s',x.channel));
    tx.appendChild(el('div','s',views(x.views)+' · '+ago(x.created_at)));
    m.appendChild(tx);b.appendChild(th);b.appendChild(m);return b;
  }

  async function home(reload){
    app.innerHTML='';
    if(reload||!vids.length){app.appendChild(el('div','empty','Cargando…'));await loadVideos();app.innerHTML=''}
    const q=$('q').value.trim().toLowerCase();
    const list=vids.filter(x=>x.title.toLowerCase().includes(q));
    if(!list.length){app.appendChild(el('div','empty',vids.length?'Ningún video coincide con tu búsqueda.':'Aún no hay videos. Inicia sesión y sube el primero.'));return}
    const g=el('div','grid');list.forEach(x=>g.appendChild(card(x)));app.appendChild(g);
  }

  async function watch(id,noCount){
    const x=vids.find(v=>v.id===id);if(!x){home();return}
    const [lk,cm,sub]=await Promise.all([
      sb.from('likes').select('user_id').eq('video_id',id),
      sb.from('comments').select('*').eq('video_id',id).order('created_at',{ascending:false}),
      sb.from('subscriptions').select('subscriber').eq('channel_owner',x.user_id)
    ]);
    const likes=lk.data||[],comments=cm.data||[],subs=sub.data||[];
    const liked=!!user&&likes.some(l=>l.user_id===user.id);
    const subd=!!user&&subs.some(s=>s.subscriber===user.id);
    if(!noCount){x.views++;sb.rpc('increment_views',{vid:id})}
    app.innerHTML='';
    const w=el('div','watch'),main=el('div');
    const pl=makePlayer(pub(x.file_path)),v=pl.v;
    main.appendChild(pl.root);
    v.onended=()=>{const i=vids.indexOf(x),n=vids[i+1]||vids[0];if(n&&n!==x)watch(n.id)};
    v.play().catch(()=>{});
    main.appendChild(el('h1',null,x.title));
    const r=el('div','row'),ch=el('div','ch');ch.appendChild(avatar(x.channel));
    const cn=el('div');cn.appendChild(el('div','t',x.channel));cn.appendChild(el('div','s',subs.length+(subs.length===1?' suscriptor':' suscriptores')));ch.appendChild(cn);
    const sbtn=el('button',subd?'btn alt':'btn',subd?'Suscrito':'Suscribirse');
    sbtn.onclick=async()=>{
      if(!user)return needLogin();
      if(subd)await sb.from('subscriptions').delete().eq('subscriber',user.id).eq('channel_owner',x.user_id);
      else await sb.from('subscriptions').insert({channel_owner:x.user_id});
      watch(id,true);
    };
    if(!user||user.id!==x.user_id)ch.appendChild(sbtn);
    const ac=el('div','acts');
    const lb=el('button',liked?'btn':'btn alt',(liked?'♥ ':'♡ ')+'Me gusta'+(likes.length?' ('+likes.length+')':''));
    lb.onclick=async()=>{
      if(!user)return needLogin();
      if(liked)await sb.from('likes').delete().eq('video_id',id).eq('user_id',user.id);
      else await sb.from('likes').insert({video_id:id});
      watch(id,true);
    };
    ac.appendChild(lb);
    if(user&&user.id===x.user_id){
      const db=el('button','btn alt','Eliminar');
      db.onclick=async()=>{
        if(!confirm('¿Eliminar este video para todos?'))return;
        await sb.storage.from('videos').remove([x.file_path].concat(x.thumb_path?[x.thumb_path]:[]));
        await sb.from('videos').delete().eq('id',id);
        vids=vids.filter(y=>y.id!==id);home();
      };
      ac.appendChild(db);
    }
    r.appendChild(ch);r.appendChild(ac);main.appendChild(r);

    const sec=el('section','cm');
    sec.appendChild(el('h2',null,comments.length+(comments.length===1?' comentario':' comentarios')));
    const inn=el('div','in'),ta=el('textarea');ta.placeholder=user?'Escribe un comentario':'Inicia sesión para comentar';ta.setAttribute('aria-label','Comentario');
    const cb=el('button','btn','Comentar');
    cb.onclick=async()=>{
      if(!user)return needLogin();
      const t=ta.value.trim();if(!t)return;
      await sb.from('comments').insert({video_id:id,author:who(),body:t});watch(id,true);
    };
    inn.appendChild(ta);inn.appendChild(cb);sec.appendChild(inn);
    comments.forEach(c=>{
      const row=el('div','c');row.appendChild(avatar(c.author));
      const b=el('div');b.appendChild(el('div','s',c.author+' · '+ago(c.created_at)));b.appendChild(el('div',null,c.body));
      row.appendChild(b);sec.appendChild(row);
    });
    main.appendChild(sec);
    const side=el('aside','side');
    vids.filter(y=>y!==x).forEach(y=>side.appendChild(card(y,true)));
    w.appendChild(main);w.appendChild(side);app.appendChild(w);window.scrollTo(0,0);
  }

  function makePlayer(src){
    const root=el('div','player paused'),v=document.createElement('video');
    v.src=src;v.playsInline=true;v.preload='metadata';root.tabIndex=0;root.appendChild(v);
    const bar=el('div','pbar'),row=el('div','prow');
    const seek=document.createElement('input');seek.type='range';seek.min=0;seek.max=1000;seek.value=0;seek.className='seek';seek.setAttribute('aria-label','Barra de progreso');
    const mk=(txt,label,fn)=>{const b=el('button','pbtn',txt);b.setAttribute('aria-label',label);b.onclick=e=>{e.stopPropagation();fn()};return b};
    const toggle=()=>{v.paused?v.play().catch(()=>{}):v.pause()};
    const full=()=>{
      if(document.fullscreenElement)document.exitFullscreen();
      else if(root.requestFullscreen)root.requestFullscreen();
      else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();
    };
    const playB=mk('▶','Reproducir',toggle);
    const muteB=mk('🔊','Silenciar',()=>{v.muted=!v.muted});
    const vol=document.createElement('input');vol.type='range';vol.min=0;vol.max=1;vol.step=0.05;vol.value=1;vol.className='vol';vol.setAttribute('aria-label','Volumen');
    vol.oninput=()=>{v.volume=parseFloat(vol.value);v.muted=v.volume===0};
    const time=el('span','ptime','0:00 / 0:00');
    const speeds=[1,1.25,1.5,2,0.5];let si=0;
    const spdB=mk('1×','Velocidad de reproducción',()=>{si=(si+1)%speeds.length;v.playbackRate=speeds[si];spdB.textContent=speeds[si]+'×'});
    const fsB=mk('⛶','Pantalla completa',full);
    row.append(playB,muteB,vol,time,el('span','sp'),spdB,fsB);
    bar.append(seek,row);root.appendChild(bar);

    v.onclick=toggle;v.ondblclick=full;
    v.onplay=()=>{playB.textContent='⏸';playB.setAttribute('aria-label','Pausar');root.classList.remove('paused')};
    v.onpause=()=>{playB.textContent='▶';playB.setAttribute('aria-label','Reproducir');root.classList.add('paused')};
    v.onvolumechange=()=>{muteB.textContent=(v.muted||v.volume===0)?'🔇':'🔊';vol.value=v.muted?0:v.volume};
    let dragging=false;
    const upd=()=>{time.textContent=fmt(v.currentTime)+' / '+fmt(v.duration);if(!dragging&&v.duration)seek.value=Math.round(v.currentTime/v.duration*1000)};
    v.ontimeupdate=upd;v.onloadedmetadata=upd;
    seek.onpointerdown=()=>{dragging=true};
    seek.onpointerup=()=>{dragging=false};
    seek.oninput=()=>{if(v.duration)v.currentTime=seek.value/1000*v.duration;upd()};
    v.onerror=()=>root.appendChild(el('div','perr','No se pudo cargar el video.'));

    let hide;const wake=()=>{root.classList.remove('idle');clearTimeout(hide);hide=setTimeout(()=>root.classList.add('idle'),2500)};
    root.onmousemove=wake;root.onfocusin=wake;root.ontouchstart=wake;
    root.onkeydown=e=>{
      const t=e.target.tagName;
      if(t==='INPUT'&&e.key.indexOf('Arrow')===0)return;
      if(t==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
      let h=true;
      if(e.key===' '||e.key==='k')toggle();
      else if(e.key==='ArrowRight')v.currentTime+=5;
      else if(e.key==='ArrowLeft')v.currentTime-=5;
      else if(e.key==='ArrowUp')v.volume=Math.min(1,v.volume+0.1);
      else if(e.key==='ArrowDown')v.volume=Math.max(0,v.volume-0.1);
      else if(e.key==='m')v.muted=!v.muted;
      else if(e.key==='f')full();
      else h=false;
      if(h){e.preventDefault();wake()}
    };
    return {root,v};
  }

  function snap(f){
    return new Promise(res=>{
      const url=URL.createObjectURL(f),t=document.createElement('video');
      t.preload='auto';t.muted=true;t.src=url;
      let done=false;const fin=(b,d)=>{if(!done){done=true;URL.revokeObjectURL(url);res({thumb:b,dur:d||0})}};
      setTimeout(()=>fin(null,t.duration),8000);
      t.onloadedmetadata=()=>{t.currentTime=Math.min(1,(t.duration||2)/2)};
      t.onseeked=()=>{try{const c=document.createElement('canvas');c.width=480;c.height=270;c.getContext('2d').drawImage(t,0,0,480,270);c.toBlob(b=>fin(b,t.duration),'image/jpeg',.7)}catch(e){fin(null,t.duration)}};
      t.onerror=()=>fin(null,0);
    });
  }

  async function auth(mode){
    const email=$('em').value.trim(),password=$('pw').value;$('aerr').textContent='';
    const r=mode==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
    if(r.error){$('aerr').textContent=r.error.message;return}
    if(mode==='up'&&!r.data.session){$('aerr').textContent='Cuenta creada. Revisa tu correo para confirmarla y luego pulsa Entrar.';return}
    $('adlg').close();
  }

  $('in').onclick=needLogin;
  $('acancel').onclick=()=>$('adlg').close();
  $('signin').onclick=()=>auth('in');
  $('signup').onclick=()=>auth('up');
  $('out').onclick=()=>sb.auth.signOut();
  $('up').onclick=()=>{$('f').value='';$('ti').value='';$('uerr').textContent='';$('udlg').showModal()};
  $('ucancel').onclick=()=>$('udlg').close();
  $('f').onchange=function(){const f=this.files[0];if(f&&!$('ti').value)$('ti').value=f.name.replace(/\.[^.]+$/,'')};
  $('pub').onclick=async()=>{
    const f=$('f').files[0],btn=$('pub');
    if(!f||f.type.indexOf('video')!==0){$('uerr').textContent='Elige un archivo de video.';return}
    btn.disabled=true;$('uerr').textContent='Subiendo… no cierres la página.';
    try{
      const {thumb,dur}=await snap(f);
      const id=crypto.randomUUID(),ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
      const fp=user.id+'/'+id+'.'+ext,tp=thumb?user.id+'/'+id+'.jpg':null;
      let r=await sb.storage.from('videos').upload(fp,f,{contentType:f.type});
      if(r.error)throw r.error;
      if(thumb)await sb.storage.from('videos').upload(tp,thumb,{contentType:'image/jpeg'});
      r=await sb.from('videos').insert({id,title:$('ti').value.trim()||f.name,channel:$('cn').value.trim()||'Mi canal',file_path:fp,thumb_path:tp,duration:dur});
      if(r.error)throw r.error;
      $('udlg').close();home(true);
    }catch(e){$('uerr').textContent='No se pudo subir: '+(e.message||e)}
    btn.disabled=false;
  };
  $('home').onclick=()=>{$('q').value='';home(true)};
  $('q').oninput=()=>home();

  sb.auth.onAuthStateChange((ev,s)=>{user=s?s.user:null;renderTop()});
  sb.auth.getSession().then(r=>{user=r.data.session?r.data.session.user:null;renderTop();home(true)});
})();
</script>
</body>
</html>
